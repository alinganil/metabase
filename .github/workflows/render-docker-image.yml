name: Build and push Docker image for Render

# Builds the full source image (frontend + uberjar) on GitHub's runners, which have far more
# RAM than Render's build environment, then pushes it to GHCR. Render is configured to pull
# this prebuilt image (runtime: image) instead of building the Dockerfile itself, so a
# memory-hungry frontend build never runs inside Render's build container.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: render-docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # rspack.config.js unconditionally builds the embedding-sdk bundle, which shells out to
      # `git rev-parse` for build metadata. .dockerignore excludes .git from the build context,
      # so BuildKit (unlike Render's builder) fails that step outright. .git only exists in the
      # multi-stage builder layer, never the final runner image, so re-including it here is safe.
      - name: Allow .git in Docker build context
        run: echo '!.git' >> .dockerignore

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MB_EDITION=ee
            VERSION=v0.0.0-${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
